app = "my-ai-pb-jinmyoung"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_DEMO_MODE = "true"
  PUBLIC_APP_ORIGIN = "https://my-ai-pb-jinmyoung.fly.dev"
  ENABLE_REAL_TOSS = "false"
  MARKET_DATA_PROVIDER = "toss"
  ENABLE_MOCK_MYDATA = "true"
  ENABLE_AGENT_TRACE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "app_data"
  destination = "/app/data"
  processes = ["app"]
